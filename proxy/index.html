<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Submission Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container-fluid">
<h2>Canvas Assignment Submission Dashboard</h2>

<div class="card mb-3">
    <div class="card-body">

        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Canvas API Token</label>
                <input id="apiToken" type="text" class="form-control" value="27093~GhRaHZ66xr7VRRJAzcN4yWTrwK3ewFMPE8hyCXuecYuzBTPae8nmwnKLhe3XrJJk">
            </div>

            <div class="col-md-3">
                <label class="form-label">Course ID</label>
                <input id="courseId" type="text" class="form-control" value="47258">
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button id="loadBtn" class="btn btn-primary w-100">
                    Load Course
                </button>
            </div>

            <div class="col-md-3">
                <label class="form-label">Filter</label>
                <select id="filterStatus" class="form-select">
                    <option value="all">All</option>
                    <option value="missing">Missing Only</option>
                    <option value="submitted">Submitted Only</option>
                </select>
            </div>

        </div>

    </div>
</div>

<div class="loading alert alert-info" id="loading">
    Loading Canvas data...
</div>

<table id="resultsTable" class="table table-bordered table-striped">
    <thead class="table-dark sticky-top">
    <tr>
        <th>Student</th>
        <th>Assignment</th>
        <th>Submitted</th>
        <th>Submitted At</th>
        <th>Due Date</th>
        <th>Until Date</th>
        <th>Status</th>
        <th>New Until Date</th>
        <th>Extend</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
</div>
<script src="script.js"></script>
</body>
</html>
